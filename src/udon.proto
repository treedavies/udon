syntax = "proto3";

package unary;

service Unary{
 rpc commit(CommitMessage) returns (MessageResponse) {}
 rpc check(CheckRequest) returns (CheckRequestResponse) {}
 rpc fetch(Request)  returns (MessageResponse) {}
 rpc clean(CleanRequest) returns (CleanResponse) {}
 rpc ping(PingRequest) returns (PingResponse) {}
 rpc module(ModuleRequest) returns (ModuleResponse) {}
 rpc fetchkey(Request) returns (FetchKeyResponse) {}
}

message FetchKeyResponse{
	bytes key = 1;
	bytes error = 2;
}

message ModuleRequest{
	bytes key_id = 1;
	bytes signature = 2;
	bytes uuid = 3;
	bytes module_name = 4;
	bytes args = 5;
}

message ModuleResponse{
	bytes rc = 1;
	bytes data = 2;
	bytes error = 3;
}

message PingRequest{}
message PingResponse{
	bytes status = 1; 
}

message CleanRequest{
	bytes key_id = 1;
	bytes signature = 2;
	bytes uuid = 3;
	bytes clean_count = 4;
}

message CleanResponse{
	bytes key_id = 1;
	bytes signature = 2;
	bytes uuid = 3;
	bytes error = 4;
}

message Request{
	bytes value  = 1;
	bytes key_id = 2;
	bytes signature = 3;
	bytes uuid = 4;
}

message CheckRequest{
	bytes key_id = 1;
	bytes signature = 2;
	bytes uuid = 3;
}

message CheckRequestResponse{
	bytes value = 1;
	bytes signature = 2;
	bytes error = 3;
}

message CommitMessage{
	bytes destination = 1;
	bytes key_id = 2;
	bytes signature = 3;
	bytes uuid = 4;

	// Dest Key encrypted 
	bytes payload = 5;
	bytes msg_signature = 6;
	bytes symetric_key = 7;
}

message MessageResponse{
	// Are these 2 fields used?
	bytes response = 1;
	bytes destination = 2;

	// Recipeint Key encrypted
	bytes payload = 3;
	bytes signature = 4;
	bytes symetric_key = 5;

	bytes error = 9;
}
